version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24 || true
        - nvm use 24 || nvm use 22 || true
        - node -v
        - npm ci --prefer-offline --no-audit
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/resqgrid-app
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
