<!-- Main dashboard container -->
<div class="min-h-screen bg-slate-100">

  <!-- ============================= -->

  <header class="bg-slate-900 text-white px-6 py-4">

    <div class="max-w-6xl mx-auto flex items-center justify-between">

      <!-- Application name -->
      <div>
        <h1 class="text-2xl font-bold">
          🚨 ResQGrid
        </h1>

        <p class="text-sm text-slate-300">
          Keeping Relief Connected When Networks Fail
        </p>
      </div>

      <!-- Connection status -->
      <div class="flex items-center gap-2">

        <!-- Green dot means we are currently online -->

        <span class="text-sm">

        </span>

      </div>

    </div>

  </header>

      <p class="mt-2 text-slate-600">

      </p>

    </section>


    <!-- ============================= -->

    <!-- ============================= -->

      <p class="text-sm text-slate-500">

      </p>

      <div class="flex items-center justify-between mt-2">

        <h3 class="text-2xl font-bold text-slate-900">
          Camp C09
        </h3>

        <span class="px-3 py-1 rounded-full bg-green-100 text-green-700 text-sm font-medium">
          Active
        </span>

      </div>

    </section>


    <!-- ============================= -->
    <!-- Main Action                   -->
    <!-- ============================= -->

      <div class="text-5xl mb-4">
        📦
      </div>

      </p>

      <!-- We'll connect this button to our request form later -->

  Clicking this button navigates the user

-->
<button
  routerLink="/create-request"
  class="px-6 py-3 bg-red-600 hover:bg-red-700
         text-white font-semibold rounded-lg
         transition">

</button>
