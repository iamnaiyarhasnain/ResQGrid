version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm use 20 || true
        - npm ci --prefer-offline --no-audit
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/aidlinkx-app/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
