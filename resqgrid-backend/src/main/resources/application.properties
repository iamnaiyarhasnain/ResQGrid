spring.application.name=resqgrid-backend

# AWS / RDS database configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Demo coordinator accounts are useful for the hackathon demo. Disable them in
# production and provide a secure account-provisioning workflow instead.
resqgrid.seed-demo-users=${SEED_DEMO_USERS:true}
resqgrid.demo-password=${DEMO_COORDINATOR_PASSWORD:ResQGrid@2026}
